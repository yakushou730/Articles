<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<!-- Tags for the root index page. Written as a comma-separated list; the
     index is rebuilt from this on push, so editing this line is how a tag
     gets changed. Reuse existing tags where one fits. -->
<meta name="tags" content="{{TAGS}}">
<style>
  :root{
    --bg:#faf9f5;
    --fg:#141413;
    --fg-soft:#5c5b57;
    --rule:#e3e1da;
    --accent:#c15f3c;
    --code-bg:#f0eee6;
    --max:46rem;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141413;
      --fg:#f0eee6;
      --fg-soft:#a8a59c;
      --rule:#33312c;
      --accent:#e0895f;
      --code-bg:#1f1e1b;
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Songti TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",Georgia,serif;
    font-size:1.0625rem;
    line-height:1.85;
    letter-spacing:.01em;
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:3.5rem 1.5rem 6rem}
  header.masthead{
    border-bottom:1px solid var(--rule);
    padding-bottom:1.75rem;
    margin-bottom:2.5rem;
  }
  .kicker{
    font-family:ui-sans-serif,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:.78rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 .9rem;
  }
  h1{
    font-size:2.15rem;
    line-height:1.3;
    margin:0 0 .8rem;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .pubdate{color:var(--fg-soft);font-size:.92rem;margin:0}
  h2{
    font-size:1.45rem;
    line-height:1.4;
    margin:3.25rem 0 1rem;
    font-weight:600;
    padding-top:.25rem;
  }
  h3{
    font-size:1.15rem;
    margin:2.5rem 0 .85rem;
    font-weight:600;
  }
  h2+h3{margin-top:1.25rem}
  p{margin:0 0 1.15rem}
  ul,ol{margin:0 0 1.25rem;padding-left:1.5rem}
  li{margin:.4rem 0}
  li>ul,li>ol{margin:.4rem 0 .3rem}
  a{color:inherit;text-decoration:underline;text-decoration-color:var(--fg-soft);text-underline-offset:3px}
  a:hover{text-decoration-color:var(--accent);color:var(--accent)}
  strong{font-weight:650}
  em{font-style:italic}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.88em;
    background:var(--code-bg);
    padding:.1em .35em;
    border-radius:4px;
  }
  pre{
    background:var(--code-bg);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:1rem 1.15rem;
    overflow-x:auto;
    font-size:.88rem;
    line-height:1.65;
  }
  pre code{background:none;padding:0;font-size:inherit}
  blockquote{
    margin:1.75rem 0;
    padding:.9rem 1.25rem;
    border-left:3px solid var(--accent);
    background:var(--code-bg);
    border-radius:0 6px 6px 0;
    color:var(--fg-soft);
    font-size:.97rem;
  }
  blockquote p:last-child{margin-bottom:0}
  figure{margin:2.25rem 0}
  figure img{
    display:block;
    width:100%;
    height:auto;
    border:1px solid var(--rule);
    border-radius:8px;
    background:#fff;
  }
  figcaption{
    text-align:center;
    color:var(--fg-soft);
    font-size:.86rem;
    margin-top:.7rem;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin:1.5rem 0;
    font-size:.94rem;
  }
  th,td{
    border:1px solid var(--rule);
    padding:.55rem .75rem;
    text-align:left;
    vertical-align:top;
  }
  th{background:var(--code-bg);font-weight:600}
  hr{border:0;border-top:1px solid var(--rule);margin:3.5rem 0}
  .lede{font-size:1.15rem;line-height:1.75}
  footer.mastfoot{
    margin-top:4rem;
    padding-top:1.5rem;
    border-top:1px solid var(--rule);
    color:var(--fg-soft);
    font-size:.88rem;
  }
  @media print{
    body{background:#fff;font-size:11pt}
    .wrap{max-width:none;padding:0}
    figure img{border:0}
    a{text-decoration:none;color:inherit}
  }
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="kicker">{{KICKER}}</p>
  <h1>{{TITLE}}</h1>
  <p class="pubdate">{{PUBDATE}}</p>
</header>

<main id="main-content">
{{CONTENT}}
</main>

<footer class="mastfoot">
  <p>本文為 <a href="{{SOURCE_URL}}">{{SOURCE_TITLE}}</a>（{{SOURCE_DATE}}）的繁體中文翻譯，僅供本機閱讀。專有名詞與關鍵術語保留原文並以括號標註。</p>
</footer>

</div>
</body>
</html>
