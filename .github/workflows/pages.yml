name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt and braces: update-index.yml normally commits the rebuilt index
      # before this runs. If the two workflows ever race, rebuild here too so
      # the published site is always consistent with the articles on disk.
      - name: Rebuild the index
        run: python3 .claude/skills/maintain-article-index/scripts/build_index.py

      # Fail the deploy rather than publish a site with root-relative URLs,
      # which 404 once Pages serves the files from a subpath.
      - name: Audit site
        run: python3 .claude/skills/maintain-article-index/scripts/audit_site.py --strict

      # Publish only what the site needs: the index, every article folder,
      # .nojekyll. Repo tooling under .claude/ stays out of the site.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          for html in */*.zh-Hant.html; do
            [ -e "$html" ] || continue
            dir=${html%%/*}
            mkdir -p "_site/$dir"
            cp "$html" "_site/$dir/"
          done
          for assets in */assets; do
            [ -d "$assets" ] || continue
            cp -R "$assets" "_site/${assets%%/*}/"
          done
          echo "Staged files:"
          find _site -type f | sort

      # Requires Pages to be enabled once in repo settings with the source set
      # to "GitHub Actions". Creating the site needs repo-admin rights, which
      # the workflow token does not have, so this cannot self-enable.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
