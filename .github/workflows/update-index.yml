name: Update article index

on:
  push:
    branches: [main]
    paths:
      - "**/*.zh-Hant.html"
      - "*/assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Real loop guard: skip the commit this workflow itself produced, so the
    # push below cannot retrigger it forever.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild index.html from the articles on disk
        run: python3 .claude/skills/maintain-article-index/scripts/build_index.py

      - name: Check whether the index actually changed
        id: diff
        run: |
          git diff --quiet index.html && echo "changed=false" >> "$GITHUB_OUTPUT" \
                                     || echo "changed=true"  >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: rebuild article index

          Generated by .github/workflows/update-index.yml from the article
          metadata on disk. Edit the article's own <h1>, meta description or
          <meta name=\"tags\"> instead of hand-editing index.html."
          git push
