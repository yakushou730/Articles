<text x="32" y="14" font-size="11" style="fill:#4c4b45">建立 pull request 前</text><text x="32" y="38" font-size="14" style="fill:#141413">工作已完成驗證</text><text x="277" y="38" font-size="13" style="fill:#4c4b45">Claude 執行測試、建置與 linter；另一個代理</text><text x="277" y="55" font-size="13" style="fill:#4c4b45">以全新脈絡審查差異內容</text>
<text x="32" y="95" font-size="11" style="fill:#4c4b45">每個 pull request 都執行</text><text x="32" y="119" font-size="14" style="fill:#141413">必要 CI</text><text x="277" y="119" font-size="13" style="fill:#4c4b45">Lint、型別、跨平台測試、建置與封裝。紅燈</text><text x="277" y="136" font-size="13" style="fill:#4c4b45">會阻止合併</text>
<text x="32" y="166" font-size="14" style="fill:#141413">Claude 程式碼審查</text><text x="277" y="166" font-size="13" style="fill:#4c4b45">多個代理平行找 bug，驗證者投票</text><text x="277" y="183" font-size="13" style="fill:#4c4b45">依嚴重性排列通過投票的發現</text><text x="32" y="213" font-size="14" style="fill:#141413">安全審查</text><text x="277" y="213" font-size="13" style="fill:#4c4b45">獨立審查；任一未結案發現都會阻止合併</text>
<text x="32" y="260" font-size="14" style="fill:#141413">依風險核准</text><text x="277" y="260" font-size="13" style="fill:#4c4b45">分類器設定層級：無需人員、一人或兩人；部分路徑</text><text x="277" y="277" font-size="13" style="fill:#4c4b45">一律需要人員審查</text><text x="32" y="317" font-size="11" style="fill:#4c4b45">合併</text><text x="32" y="341" font-size="14" style="fill:#141413">合併佇列</text><text x="277" y="341" font-size="13" style="fill:#4c4b45">套用變更後，在最新 main 上重跑檢查</text>
<text x="32" y="381" font-size="11" style="fill:#4c4b45">合併後</text><text x="32" y="405" font-size="14" style="fill:#141413">先透過旗標供內部使用</text><text x="277" y="405" font-size="13" style="fill:#4c4b45">Anthropic 員工先用，再向所有人發布</text><text x="32" y="435" font-size="14" style="fill:#141413">分階段發布</text><text x="277" y="435" font-size="13" style="fill:#4c4b45">latest 頻道先發布；stable 頻道稍後更新</text><text x="32" y="465" font-size="14" style="fill:#141413">監看、向前修正或回復</text><text x="277" y="465" font-size="13" style="fill:#4c4b45">作者與 on-call 監看；旗標可快速關閉，故障</text><text x="277" y="482" font-size="13" style="fill:#4c4b45">建置會回復</text>
