<text x="32" y="14" font-size="12.75" style="fill:#4c4b45">建立 pull request 前</text><text x="32" y="39" font-size="14" style="fill:#141413">工作已完成驗證</text><text x="32" y="57" font-size="13" style="fill:#4c4b45">Claude 執行測試、建置與 linter；</text><text x="32" y="74" font-size="13" style="fill:#4c4b45">第二個代理在全新脈絡中審查</text><text x="32" y="91" font-size="13" style="fill:#4c4b45">差異內容</text>
<text x="32" y="127" font-size="12.75" style="fill:#4c4b45">每個 pull request 都執行</text><text x="32" y="152" font-size="14" style="fill:#141413">必要 CI</text><text x="32" y="170" font-size="13" style="fill:#4c4b45">Lint、型別、跨平台測試、建置</text><text x="32" y="187" font-size="13" style="fill:#4c4b45">與封裝；紅燈會阻止合併</text>
<text x="32" y="215" font-size="14" style="fill:#141413">Claude 程式碼審查</text><text x="32" y="233" font-size="13" style="fill:#4c4b45">代理平行尋找 bug，驗證者</text><text x="32" y="250" font-size="13" style="fill:#4c4b45">逐項投票；發現依嚴重性排序</text>
<text x="32" y="295" font-size="14" style="fill:#141413">安全審查</text><text x="32" y="313" font-size="13" style="fill:#4c4b45">獨立審查；未結案發現會</text><text x="32" y="330" font-size="13" style="fill:#4c4b45">阻止合併</text>
<text x="32" y="358" font-size="14" style="fill:#141413">依風險核准</text><text x="32" y="376" font-size="13" style="fill:#4c4b45">不需人員、一人或兩人；</text><text x="32" y="393" font-size="13" style="fill:#4c4b45">部分路徑一律需要人員審查</text>
<text x="32" y="429" font-size="12.75" style="fill:#4c4b45">合併</text><text x="32" y="454" font-size="14" style="fill:#141413">合併佇列</text><text x="32" y="472" font-size="13" style="fill:#4c4b45">套用變更後，在最新 main 上</text><text x="32" y="489" font-size="13" style="fill:#4c4b45">重新執行檢查</text>
<text x="32" y="525" font-size="12.75" style="fill:#4c4b45">合併後</text><text x="32" y="550" font-size="14" style="fill:#141413">先透過旗標供內部使用</text><text x="32" y="568" font-size="13" style="fill:#4c4b45">Anthropic 員工先使用，</text><text x="32" y="585" font-size="13" style="fill:#4c4b45">再向所有人發布</text>
<text x="32" y="613" font-size="14" style="fill:#141413">分階段發布</text><text x="32" y="631" font-size="13" style="fill:#4c4b45">latest 頻道先發布；stable</text><text x="32" y="648" font-size="13" style="fill:#4c4b45">頻道稍後更新</text>
<text x="32" y="676" font-size="14" style="fill:#141413">監看、向前修正或回復</text><text x="32" y="694" font-size="13" style="fill:#4c4b45">作者與 on-call 監看；旗標</text><text x="32" y="711" font-size="13" style="fill:#4c4b45">可快速關閉，故障建置會回復</text>
